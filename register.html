<!DOCTYPE html>
<html>
<head>
  <title>Register - G.L. Bajaj Online Book Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img class="logo" src="college-logo.jpg" alt="G.L. Bajaj Logo">
    <h1>G.L. Bajaj Online Book Store</h1>
    <div class="menu">
      <a href="home.html">Home</a> |
      <a href="login.html">Login</a> |
      <a href="register.html">Register</a> |
      <a href="catalogue.html">Catalogue</a> |
      <a href="cart.html">Cart</a>
    </div>
  </div>

  <div class="container">

    <div class="sidebar">
      <h3>Categories</h3>
      <a href="catalogue.html">CSE Books</a>
      <a href="catalogue.html">ECE Books</a>
      <a href="catalogue.html">Mechanical Books</a>
    </div>

    <div class="content">
      <!-- Registration form -->
      <div class="box">
        <h2>Registration Page</h2>

        <input type="text" placeholder="Full Name">
        <input type="email" placeholder="Email">
        <input type="text" placeholder="Mobile No.">
        <input type="password" placeholder="Password">
        <input type="password" placeholder="Confirm Password">

        <p>Sex:</p>
        <input type="radio" name="sex"> Male
        <input type="radio" name="sex"> Female
        <input type="radio" name="sex"> Other

        <p>Date of Birth:</p>
        <select>
          <option>Day</option>
        </select>
        <select>
          <option>Month</option>
        </select>
        <select>
          <option>Year</option>
        </select>

        <p>Languages Known:</p>
        <input type="checkbox"> English <br>
        <input type="checkbox"> Hindi <br>
        <input type="checkbox"> Telugu <br>
        <input type="checkbox"> Tamil

        <p>Address:</p>
        <textarea rows="4" placeholder="Enter your address here"></textarea>

        <button>Register</button>
      </div>
    </div>

  </div>

  <div class="footer">
    <p> Priyanshu Yadav</p>
    <p>Roll No.2501920110286</p>
  </div>

</body>
</html>
